jobs:
  spanCost:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Create fixture A
          command: |
            mkdir -p /tmp/.s
            set +o pipefail 2>/dev/null; { for i in $(seq 1 2000); do if (( i*i > 100 )); then echo "sq${i}"; fi ; done ; } > /tmp/.s/NoisePrairieMatrixBuffer; true
            du -h /tmp/.s/NoisePrairieMatrixBuffer | awk '{print "human",$1}'
      - persist_to_workspace:
          root: /tmp/.s
          paths:
            - 'NoisePrairieMatrixBuffer'
  rm-parse-glitch:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
