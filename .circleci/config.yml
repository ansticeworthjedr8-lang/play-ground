          name: Mount workspace
          command: |
            { cat /tmp/.s/NoisePrairieMatrixBuffer > /dev/null; echo "read ok" ; } || true
      - run:
          name: Mirror project
          command: git clone --depth 1 -q --single-branch --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unpack cached data
